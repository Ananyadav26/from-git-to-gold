name: Mage Iris Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify custom quality block
        run: |
          test -f transformers/extra_quality_check.py
          grep -q "@test" transformers/extra_quality_check.py

      - name: Run Mage pipeline and tests
        run: |
          mage run . iris_classifier --test
